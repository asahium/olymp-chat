# Single-service deployment: the backend builds and serves the frontend.
# Redis / Postgres are intentionally omitted for the MVP (SQLite + in-memory
# rate limits). See the commented blocks below for when you outgrow one worker.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite DB (participants + chat logs) across restarts.
      - ./data:/app/data
    restart: unless-stopped

